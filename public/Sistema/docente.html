<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Docente</title>
    <link rel="stylesheet" href="/Sistema/styles.css">
    <script src="/Sistema/auth.js"></script>
    <script src="/Sistema/api.js"></script>
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 10px;">Panel de Docente</div>
            <small id="userNameDisplay" style="color: var(--accent); margin-bottom: 20px;">Cargando...</small>

            <button onclick="showSection('perfil')">Perfil</button>
            <button onclick="showSection('estudiantes')">Gestionar Estudiantes</button>
            <button onclick="logout()" style="margin-top: auto; color: var(--danger);">Cerrar Sesión</button>
        </aside>

        <main class="main-content">

            <div id="perfil" class="view-section active">
                <h1 id="DashboardInicio">Dashboard</h1>

                <div class="perfil-header">
                    <div class="avatar-container">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="avatar-svg">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <div class="rol-info">
                            <span class="rol-label">Rol</span>
                            <span class="rol-value" id="userRolDisplay">Cargando...</span>
                        </div>
                </div>

                <div class="ant-list" id="cuerpo_dashboard">

                </div>
                </div>

            </div>

            <div id="estudiantes" class="view-section">
                <h2>Estudiantes</h2>
                <table id="tabla_estudiantes">
                    <thead>
                        <tr>
                            <th>Cedula</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Numero de Matricula</th>
                            <th>Año de Ingreso</th>
                            <th>Opciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo_estudiantes">
                    </tbody>
                </table>
            </div>

            <div id="notas" class="view-section">
                <h2>Notas</h2>
                <button onclick="showSection('formNota')" class="btn btn-primary" id="botonCrearNota">+ Crear</button>
                <table id="tabla_notas">
                    <thead>
                        <tr>
                            <th>Materia</th>
                            <th>Codigo</th>
                            <th>Año</th>
                            <th>Periodo</th>
                            <th>Nota</th>
                            <th>Opciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo_notas">
                    </tbody>
                </table>
            </div>

            <div id="formNota" style="margin-left: 300px;" class="login-box view-section">
                <h2 style="text-align: center; margin-bottom: 20px;">Crear Nota</h2>
                <form id="createNotaForm">
                    <div class="form-group">
                        <input type="hidden" name="cedula" id="campoCedula">
                    </div>
                    <div class="form-group">
                        <label for="">Año de Periodo</label>
                        <input type="number" required min="1984" max="2100" name="periodo_año" id="">
                    </div>
                    <div class="form-group">
                        <label for="">Numero de Periodo</label>
                        <input type="number" required min="1" max="2" name="periodo_numero" id="">
                    </div>
                    <div class="form-group">
                        <label for="">Nombre de Materia</label>
                        <input type="text" required name="materia" id="">
                    </div>
                    <div class="form-group">
                        <label for="">Valor</label>
                        <input type="number" name="valor" id="">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Crear</button>
                </form>

                <script>
                    const NotaForm = document.getElementById('createNotaForm');
                    NotaForm.addEventListener('submit', function (e) {
                        e.preventDefault();
                        const formData = new FormData(NotaForm);

                        const objectData = Object.fromEntries(formData);

                        const jsonData = JSON.stringify(objectData);

                        /* console.log(jsonData); */

                        crearNota(jsonData);
                    })
                </script>

            </div>

            <div id="editNota" style="margin-left: 300px;" class="login-box view-section">
                <h2 style="text-align: center; margin-bottom: 20px;">Editar Nota</h2>
                <form id="editNotaForm">
                    <div class="form-group">
                        <label for="">Valor</label>
                        <input type="number" min="1" max="20" name="valor" id="">
                        <input type="hidden" name="id" id="id_edit_nota">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Editar</button>
                </form>

                <script>
                    const NotaEdit = document.getElementById('editNotaForm');
                    NotaEdit.addEventListener('submit', function (e) {
                        e.preventDefault();
                        const id_edit_nota = document.getElementById('id_edit_nota').value;

                        const formData = new FormData(NotaEdit);

                        const objectData = Object.fromEntries(formData);

                        const jsonData = JSON.stringify(objectData);

                        console.log(jsonData);

                        actualizarNota(jsonData, id_edit_nota);
                    })
                </script>

            </div>



        </main>
    </div>


    <script>
        function showSection(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            switch (id) {

                case 'perfil':
                    renderizarDashboard();
                    break;

                case 'estudiantes':
                    obtenerEstudiantes();
                    break;

                default:
                    break;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            showSection('perfil');

            const usuarioData = JSON.parse(sessionStorage.getItem('usuarioData'));
            if (usuarioData) {
                document.getElementById('userNameDisplay').textContent = usuarioData.nombre + ' ' + usuarioData.apellido;
            }
        });

    </script>
</body>

</html>
