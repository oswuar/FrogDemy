<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/Sistema/styles.css">
    <script>"notificacion.js"</script>
</head>
<body class="bg-login">
    <div class="login-container">
        <div class="login-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Inicio De Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="admin@test.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPass" placeholder="1234" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>

                <div class="login-footer">
                    <a href="index.html">Volver</a>
                </div>
            </form>
        </div>
    </div>



    <script src="/Sistema/notificacion.js"></script>
    <script src="/Sistema/api.js"></script>
    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;

        // Llamada a función real
        login(email, pass);
    });
</script>
</body>
</html>
