<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dashboard Estudiante</title>
    <link rel="stylesheet" href="styles.css">
    <script src="api.js"></script>
    <script src="auth.js"></script>
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">Estudiante</div>
            <small id="userNameDisplay" style="color: var(--accent); margin-bottom: 20px;">Cargando...</small>
            <button onclick="showSection('perfil')">Perfil</button>
            <button onclick="showSection('notas')">Mis Notas</button>
            <button onclick="showSection('ayuda')">Ayuda</button>
            <button onclick="logout()" style="margin-top: auto; color: var(--danger);">Cerrar Sesión</button>
        </aside>

        <main class="main-content">
            <div id="perfil" class="view-section active">
                <h1 id="DashboardInicio">Dashboard</h1>
                 <!-- Sección Perfil -->
                <!-- Cabecera con avatar y rol -->
                <div class="perfil-header">
                    <div class="avatar-container">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="avatar-svg">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <div class="rol-info">
                            <span class="rol-label">Rol</span>
                            <span class="rol-value" id="userRolDisplay">Cargando...</span>
                        </div>
                </div>
    
                <!-- Lista hormiga con los datos del perfil -->
                <div class="ant-list" id="cuerpo_dashboard">
                    <!-- Los items se generan dinámicamente con JavaScript -->
                </div>
                </div>

            </div>

            <div id="notas" class="view-section">
                <h1 id="misCalificaciones">Mis Calificaciones</h1>
                <table id="tabla_notas">
                    <thead>
                        <tr>
                            <th>Materia</th>
                            <th>Codigo</th>
                            <th>Año</th>
                            <th>Periodo</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo_notas">
                    </tbody>
                </table>
            </div>

            <div id="ayuda" class="view-section">
                <h1 id="misCalificaciones">Estudiante</h1>
                <h3 id="misCalificaciones">Manual de Usuario para Estudiantes</h1>
            </div>
        </main>

        <script>
            function showSection(id) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById(id).classList.add('active');

                switch (id) {

                    case 'perfil':
                        renderizarDashboard();
                        break;

                    case 'notas':
                        obtenerMisNotas();
                        break;

                    default:
                        break;
                }
            }

            // Inicializar al cargar la página
            document.addEventListener('DOMContentLoaded', function() {
                // Mostrar la sección de perfil por defecto
                showSection('perfil');

                // Cargar el nombre del usuario en el sidebar desde sessionStorage
                const usuarioData = JSON.parse(sessionStorage.getItem('usuarioData'));
                if (usuarioData) {
                    document.getElementById('userNameDisplay').textContent = usuarioData.nombre + ' ' + usuarioData.apellido;
                }
            });

        </script>
    </div>
</body>

</html>
